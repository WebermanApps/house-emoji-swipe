*{box-sizing:border-box}html,body{margin:0;background:#FBF8F2;color:#0a0a0a;font-family:Hind,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;overscroll-behavior:none}
.app{max-width:460px;margin:0 auto;padding:14px 16px 96px;display:flex;flex-direction:column;min-height:100dvh}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font:700 12px Hind,sans-serif;letter-spacing:.14em;text-transform:uppercase}
h1{font-family:Khand,sans-serif;font-weight:700;font-size:30px;line-height:1;margin:12px 0 2px;letter-spacing:-.01em}
.sub{color:#737373;font-size:14px;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px}
.count{font:700 12px Hind,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#525252}
.bar{height:4px;background:#e5e5e5;margin:0 0 12px}.bar i{display:block;height:100%;background:#171717;transition:width .25s}
.btn{min-height:44px;padding:0 14px;background:#fff;border:1px solid #171717;color:#171717;font:700 12px Hind,sans-serif;letter-spacing:.1em;text-transform:uppercase;border-radius:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.35;cursor:default}
.stack{position:relative;flex:1;min-height:380px;max-height:520px;aspect-ratio:3/4;width:100%;margin:0 auto}
.card{position:absolute;inset:0;background:#fff;border:1px solid #e5e5e5;border-radius:16px;box-shadow:0 8px 28px rgba(10,10,10,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;user-select:none;will-change:transform}
.card svg{width:92%;height:auto;max-height:78%}
.card .id{position:absolute;top:12px;left:14px;font:700 12px Hind,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#737373}
.card .tags{position:absolute;bottom:12px;left:12px;right:12px;text-align:center;font-size:12px;color:#737373;line-height:1.35}
.card.back{transform:scale(.95) translateY(10px);opacity:.7}
.stamp{position:absolute;top:18px;padding:4px 10px;border:3px solid;font:700 20px Khand,sans-serif;letter-spacing:.06em;text-transform:uppercase;opacity:0;border-radius:6px;background:#fff}
.stamp.yes{right:16px;color:#2E7D4F;border-color:#2E7D4F;transform:rotate(8deg)}.stamp.no{left:16px;color:#8a8a8a;border-color:#8a8a8a;transform:rotate(-8deg)}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:14px 0 6px}
.acts .btn{min-height:56px;flex-direction:column;gap:2px;font-size:11px}
.acts .ic{font-size:20px;line-height:1}
.b-no{color:#737373;border-color:#bdbdbd}.b-yes{background:#2E7D4F;border-color:#2E7D4F;color:#fff}.b-love .ic{color:#D62C3B}.b-maybe .ic{color:#B7862B}
.under{display:flex;justify-content:center;gap:10px}
.under .btn{min-height:44px;border-color:#d4d4d4;color:#525252;font-size:11px}
.res{display:none}.res h2{font-family:Khand,sans-serif;font-size:26px;margin:14px 0 6px}
.grp{margin:10px 0}.grp b{display:block;font:700 12px Hind,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.thumbs div{background:#fff;border:1px solid #e5e5e5;border-radius:10px;text-align:center;font-size:11px;color:#737373;padding:2px}.thumbs svg{width:100%;height:auto;display:block}
.line{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#fff;border:1px solid #e5e5e5;padding:10px;word-break:break-word}
@media(min-width:700px){.app{max-width:520px;padding-top:28px}h1{font-size:36px}}
@media (prefers-reduced-motion:reduce){.card{transition:none!important}}
